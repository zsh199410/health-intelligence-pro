name: Verify existing Build 22 IPA
on:
  push:
    branches: ['codex/verify-ipa-build-22']
    paths: ['.github/workflows/verify-built-ipa.yml']

permissions:
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.inspect.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iphone-unsigned-signing-input
          github-token: ${{ github.token }}
          run-id: 45552674186
          path: candidate
      - id: inspect
        working-directory: candidate
        run: |
          set -euo pipefail
          ipa=HealthIntelligence-iPhone-UNSIGNED.ipa
          sha256sum --check SHA256SUMS.txt
          grep -Fx 'Source commit: dad8da3722ce3e8648abf89febf20fb0c8a51097' README-SIGN-BEFORE-INSTALL.txt
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile("HealthIntelligence-iPhone-UNSIGNED.ipa") as archive:
              assert archive.testzip() is None
              root = "Payload/HealthIntelligence.app/"
              info = plistlib.loads(archive.read(root + "Info.plist"))
              assert info["CFBundleShortVersionString"] == "2.0.0"
              assert info["CFBundleVersion"] == "22"
              assert info["CFBundleIdentifier"] == "app.rose4354.lettuce4008"
              assert archive.getinfo(root + info["CFBundleExecutable"]).file_size > 0
          PY
          digest=$(sha256sum "$ipa" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
  receipt:
    needs: inspect
    runs-on: ubuntu-latest
    name: IPA SHA256 ${{ needs.inspect.outputs.sha256 }}
    steps:
      - run: echo 'Build 22 existing IPA verified.'
  propose:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Propose verified iPhone candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=zsh199410/health-intelligence-pro
          head=codex/iphone-sleep-candidate
          expected=dad8da3722ce3e8648abf89febf20fb0c8a51097
          test "$(gh api "repos/$repo/git/ref/heads/$head" --jq .object.sha)" = "$expected"
          cat > "$RUNNER_TEMP/pr.md" <<'BODY'
          iPhone 2.0.0（Build 22）独立候选。修复最近睡眠摘要与夜间详情的一致性，整合 #23 的授权重试修复，改进 Watch 刷新失败提示。

          关联 #2。iPhone arm64 未签名包已生成并复核，签名、安装和实际健康记录验证待完成。PPG 在独立实验分支开发。

          [构建产物](https://github.com/zsh199410/health-intelligence-pro/actions/runs/45552674186/artifacts/14994178377)
          BODY
          if ! gh api --method POST "repos/$repo/pulls" -f base=main -f head="$head" -F draft=true \
              -f title='P0：iPhone 2.0.0（Build 22）睡眠与 HealthKit 授权候选' \
              -F body=@"$RUNNER_TEMP/pr.md" > "$RUNNER_TEMP/result.json"; then
            reason=$(jq -r '.message // "GitHub REST request failed"' "$RUNNER_TEMP/result.json")
            echo "::error::$reason"
            exit 1
          fi
          jq -r .html_url "$RUNNER_TEMP/result.json"
