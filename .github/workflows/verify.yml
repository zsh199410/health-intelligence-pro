name: Health Intelligence Source Verification
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version
      - name: Swift package unit tests
        run: cd Core && swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: bash Scripts/generate_xcode_project.sh
      - name: Build iOS simulator without signing
        run: |
          set -o pipefail
          xcodebuild -project HealthIntelligence.xcodeproj -scheme HealthIntelligence \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee ios-build.log
      - name: Build watchOS simulator without signing
        run: |
          set -o pipefail
          xcodebuild -project HealthIntelligence.xcodeproj -scheme HealthWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee watch-build.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: '*-build.log'
          if-no-files-found: ignore

  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: bash Scripts/generate_xcode_project.sh
      - name: Run screenshot UI tests
        run: |
          set -o pipefail
          xcodebuild test -project HealthIntelligence.xcodeproj -scheme HealthIntelligence \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:HealthIntelligenceUITests \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee uitest.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d UITestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path UITestResults.xcresult --output-path screenshots \
              || echo "xcresulttool export failed, the xcresult is still uploaded below"
            # xcresulttool writes UUID file names; normalize them to
            # <mode>-<page>.png via the export manifest (copies only,
            # sources kept) and verify all 22 decode at 1206x2622.
            python3 Scripts/normalize_screenshots.py screenshots --with-ppg
          fi
          find screenshots -type f -name '*.png' | sort
      - name: Cross-check full-screen capture
        if: always()
        run: |
          # Ground truth for the device screen: simctl captures the real
          # framebuffer (iPhone 17 Pro must be 1206x2622). If this and
          # the XCTest shots disagree, the test capture — not the app —
          # is framing wrong. Saved for the Verify step to compare.
          xcrun simctl io booted screenshot screenshots/simctl-crosscheck.png \
            || echo "WARNING: simctl screenshot failed (simulator may not be booted)"
          if [ -f screenshots/simctl-crosscheck.png ]; then
            python3 Scripts/png_check.py size screenshots/simctl-crosscheck.png 1206 2622 \
              || echo "WARNING: simctl cross-check is not 1206x2622; see Verify step"
          fi
      - name: Capture Watch screenshots
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project HealthIntelligence.xcodeproj -scheme HealthWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build-dd \
            CODE_SIGNING_ALLOWED=NO build | tee watch-build.log
          bash Scripts/capture_watch_screenshot.sh \
            "build-dd/Build/Products/Debug-watchsimulator/HealthWatch.app" \
            "screenshots"
      - name: Verify screenshot set
        if: always()
        run: |
          echo "== files =="
          find screenshots -type f | sort
          echo "== normalized iPhone set (expect 22 at 1206x2622) =="
          python3 Scripts/normalize_screenshots.py screenshots --with-ppg
          echo "== watch manifest (strict JSON, numeric pids, real shots) =="
          python3 Scripts/verify_watch_manifest.py screenshots
          echo "== simctl cross-check =="
          if [ -f screenshots/simctl-crosscheck.png ]; then
            python3 Scripts/png_check.py size screenshots/simctl-crosscheck.png 1206 2622 \
              || { echo "FAIL: simctl cross-check is not the iPhone 17 Pro full screen (1206x2622); the simulator rendered at the wrong size, so the XCTest shots cannot be trusted as full-screen evidence"; exit 1; }
          else
            echo "WARNING: simctl cross-check missing (UI tests may have failed before boot)"
          fi
          echo "== non-empty check =="
          find screenshots -type f -name '*.png' -empty -print | grep . && { echo "FAIL: empty PNG present"; exit 1; } || echo "all PNGs non-empty"
          echo "OK: screenshot set complete"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-results
          path: |
            UITestResults.xcresult
            uitest.log
            watch-build.log
          if-no-files-found: ignore
