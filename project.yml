name: HealthIntelligence
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "20"
packages:
  HealthCore:
    path: Core
targets:
  HealthIntelligence:
    type: application
    platform: iOS
    sources:
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rose4354.lettuce4008
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: HealthIntelligence
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "健康中枢"
        INFOPLIST_KEY_NSCameraUsageDescription: "应您主动请求，使用后置摄像头在本机分析指尖脉搏信号质量。不会保存视频。"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "用于读取您选择的心率、睡眠、体征和健康记录，并在本机呈现趋势。"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "仅将您明确输入的血压、血糖和体重写入 Apple 健康。"
        # Launch screen: without a launch screen key iOS runs the app in
        # 16:9 compatibility mode on 19.5:9 phones (black bars top and
        # bottom in screenshots). UILaunchStoryboardName is a plain string
        # key, so it works with the generated Info.plist; UILaunchScreen
        # is a dictionary and cannot be set via INFOPLIST_KEY, and an
        # info: section without a path breaks XcodeGen parsing.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    entitlements:
      path: Configuration/iOS.entitlements
    dependencies:
      - package: HealthCore
      - target: HealthWatch
        embed: true

  HealthWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthintelligence.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: HealthWatch
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "健康中枢"
        INFOPLIST_KEY_WKWatchKitApp: "YES"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.healthintelligence
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "YES"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "在手表端读取您授权的心率、HRV、血氧及呼吸频率。"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
    entitlements:
      path: Configuration/Watch.entitlements
    dependencies:
      - package: HealthCore

  HealthIntelligenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthintelligence.uitests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: HealthIntelligence
